<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">◌</div><div><strong>留在場外</strong><span>OUTSIDE THE LINE</span></div></div>
  <nav class="nav" id="nav">
    <button data-view="lobby" class="active"><span class="ico">▤</span> 模擬賽事</button>
    <button data-view="tickets"><span class="ico">▧</span> 投注紀錄</button>
    <button data-view="ledger"><span class="ico">◷</span> 資金流水</button>
    <button data-view="limits"><span class="ico">◇</span> 戒賭設定</button>
    <button data-view="data"><span class="ico">⚙</span> 資料管理</button>
  </nav>
  <div class="sidefoot"><strong>完全虛擬 · 不連接真實金流</strong><br>在這裡，想嘗試的下注可以只停留在模擬。記錄風險，而不是追逐輸贏。</div>
</aside>
<main class="main"><div class="topline"><span class="breadcrumb" id="breadcrumb">首頁 / 模擬賽事</span><span class="topnote"><i class="dot"></i> 純模擬 · 0 元真實支出</span></div><div id="app"></div><div class="footer">「留在場外」為獨立的非商業模擬作品，與台灣運彩無關。示範賽事、示範賠率及手動結算結果均非官方資料。資料儲存在目前瀏覽器；清除網站資料可能使紀錄消失。</div></main>
</div>
<button class="mobile-slip hidden" id="mobileSlip" data-action="go-slip">◉ 查看選單 · <span id="slipCounter">0</span></button>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div><input id="backupImport" type="file" accept=".json,application/json" class="hidden"><input id="feedImport" type="file" accept=".json,application/json" class="hidden">
<script>
(()=>{'use strict';
const KEY='outside-line-sports-sim-v1';
const fmt=n=>Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2,minimumFractionDigits:0});
const money=n=>fmt(n)+' 點';
const round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const stamp=t=>new Date(t).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const fulldate=t=>new Date(t).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const inHours=h=>new Date(Date.now()+h*3600000).toISOString();
const sportIcon=s=>({'籃球':'◉','棒球':'●','足球':'⚽','網球':'◎','排球':'◇','其他':'◈'})[s]||'◈';
const sourceLabel=s=>({'demo':'示範數據','manual':'手動建立','external':'外部匯入'})[s]||'未標註';
const seedEvents=()=>[
 {id:'demo-bb1',sport:'籃球',league:'示範籃球聯賽',away:'山城獵鷹',home:'海灣航行者',startsAt:inHours(5),odds:{away:1.91,home:1.82},source:'demo'},
 {id:'demo-bs1',sport:'棒球',league:'示範棒球聯賽',away:'北方閃電',home:'南港白鯨',startsAt:inHours(8),odds:{away:2.12,home:1.68},source:'demo'},
 {id:'demo-fb1',sport:'足球',league:'示範足球聯賽',away:'東城聯隊',home:'湖畔競技',startsAt:inHours(14),odds:{away:2.85,draw:3.15,home:2.27},source:'demo'},
 {id:'demo-vb1',sport:'排球',league:'示範排球聯賽',away:'松林藍鷹',home:'晴空旋風',startsAt:inHours(26),odds:{away:1.75,home:2.06},source:'demo'},
 {id:'demo-te1',sport:'網球',league:'示範網球挑戰賽',away:'選手甲',home:'選手乙',startsAt:inHours(32),odds:{away:1.59,home:2.33},source:'demo'},
 {id:'demo-bb2',sport:'籃球',league:'示範籃球聯賽',away:'中央星辰',home:'西海巨浪',startsAt:inHours(42),odds:{away:2.31,home:1.56},source:'demo'}
];
let state=null;let view='lobby';let ui={filter:'全部',slip:[],slipType:'single',stake:'100',ticketFilter:'all',modal:null};
const newState=(initial)=>({version:1,createdAt:new Date().toISOString(),initial,balance:initial,tickets:[],ledger:[{id:uid(),at:new Date().toISOString(),type:'initial',amount:initial,note:'建立初始模擬帳戶'}],events:seedEvents(),settings:{dailyLimit:500,pauseUntil:null,feedUrl:''}});
function validateBackup(s){if(!s||s.version!==1||!Array.isArray(s.events)||!Array.isArray(s.tickets)||!Array.isArray(s.ledger)||!s.settings||!Number.isFinite(s.balance)||s.balance<0||!Number.isFinite(s.initial)||s.initial<=0)throw Error('備份檔案格式不正確');if(s.tickets.length>10000||s.events.length>3000||s.ledger.length>20000)throw Error('備份資料量過大');return s}
try{const raw=localStorage.getItem(KEY);if(raw)state=validateBackup(JSON.parse(raw))}catch(e){console.warn('Storage read issue:',e)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('無法保存資料，請檢查 Safari 私密瀏覽或儲存空間。');return false}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),4000)}
const isPaused=()=>state&&state.settings.pauseUntil&&new Date(state.settings.pauseUntil).getTime()>Date.now();
const todayKey=d=>new Date(d).toLocaleDateString('en-CA');
const usedToday=()=>state.tickets.filter(t=>todayKey(t.placedAt)===todayKey(new Date())).reduce((a,t)=>a+t.stake,0);
const exposure=()=>state.tickets.filter(t=>t.status==='pending').reduce((a,t)=>a+t.stake,0);
const realized=()=>round(state.tickets.filter(t=>t.status!=='pending').reduce((a,t)=>a+(t.payout||0)-t.stake,0));
const metrics=()=>({balance:state.balance,exposure:round(exposure()),realized:realized(),open:state.tickets.filter(t=>t.status==='pending').length,available:Math.max(0,round(state.settings.dailyLimit-usedToday()))});
const eventById=id=>state.events.find(e=>e.id===id);
const canBet=e=>e&&!e.result&&new Date(e.startsAt).getTime()>Date.now();
const pickLabels=e=>[{key:'away',label:e.away},{key:'draw',label:'和局'},{key:'home',label:e.home}].filter(o=>Number.isFinite(Number(e.odds[o.key]))&&Number(e.odds[o.key])>1);
const calcOdds=()=>round(ui.slip.reduce((a,p)=>a*Number(eventById(p.id)?.odds[p.outcome]||1),1));
const navNames={lobby:'模擬賽事',tickets:'投注紀錄',ledger:'資金流水',limits:'戒賭設定',data:'資料管理'};
const statsHtml=()=>{const m=metrics();return `<div class="stats">
 <div class="stat"><div class="statlabel">目前可用虛擬點數 <span>◎</span></div><div class="num">${fmt(m.balance)}<small> 點</small></div><div class="subline">起始本金 ${money(state.initial)}</div></div>
 <div class="stat"><div class="statlabel">尚未結算的風險 <span>◷</span></div><div class="num">${fmt(m.exposure)}<small> 點</small></div><div class="subline">${m.open} 張模擬票券等待結果</div></div>

function fixtureHtml(e){const bettable=canBet(e);const outcomes=pickLabels(e);return `<article class="fixture"><div class="meta"><span>${esc(sportIcon(e.sport))} ${esc(e.sport)}</span><span>· ${esc(e.league)}</span><span>· ${esc(stamp(e.startsAt))}</span><span class="tag ${esc(e.source)}">${esc(sourceLabel(e.source))}</span>${e.result?'<span class="tag done">已登錄結果</span>':''}</div>

function ticketsHtml(){const items=state.tickets.filter(t=>ui.ticketFilter==='all'||t.status===ui.ticketFilter).slice().reverse();return `<div class="section-head"><div><h2>模擬投注紀錄</h2><p>所有投注保存當時賠率，不因之後賽事賠率更新而變動。</p></div></div><div class="tabs">${[['all','全部'],['pending','待結算'],['win','已猜中'],['loss','未猜中'],['void','退還']].map(([k,label])=>`<button data-action="ticket-filter" data-filter="${k}" class="${ui.ticketFilter===k?'active':''}">${label}</button>`).join('')}</div><section class="panel">${items.length?items.map(ticketHtml).join(''):'<div class="empty"><span class="big">▧</span>目前沒有符合條件的模擬投注紀錄。</div>'}</section>`}

function ledgerHtml(){const entries=state.ledger.slice().reverse();return `<div class="section-head"><div><h2>虛擬資金流水</h2><p>每次投入或結算會留下完整紀錄，方便追蹤資金變化。</p></div><button class="btn" data-action="export">↓ 備份資料</button></div>${statsHtml()}<section class="panel tablewrap"><table><thead><tr><th>日期</th><th>類型</th><th>說明</th><th>點數變動</th></tr></thead><tbody>${entries.map(l=>`<tr><td>${esc(fulldate(l.at))}</td><td>${l.type==='initial'?'初始資金':l.type==='stake'?'模擬下注':'賽事結算'}</td><td>${esc(l.note)}</td><td class="${l.amount<0?'negative':'positive'}">${l.amount>0?'+':''}${fmt(l.amount)}</td></tr>`).join('')}</tbody></table></section><div class="strip">ⓘ 此流水僅記錄虛擬點數，不代表真實銀行存款、投資或運彩交易。</div>`}
function limitsHtml(){const left=isPaused()?fulldate(state.settings.pauseUntil):null;return `<div class="section-head"><div><h2>戒賭與使用界線</h2><p>練習的目的，是讓決定留在模擬裡，而不是追逐損失。</p></div></div><div class="banner">沒有入金與提款按鈕，也不提供「輸光後立即補點」。你的歷史紀錄與當時的判斷，比短暫的輸贏更值得保留。</div><div class="rule-grid"><div class="setting"><h3>每日模擬投入上限</h3><p>今天已投入 ${money(usedToday())}，剩餘 ${money(metrics().available)}。變更上限不會刪除已使用的額度。</p><label class="field">每日最多使用（點）<input id="dailyLimit" type="number" min="1" max="100000" step="1" value="${esc(state.settings.dailyLimit)}"></label><button class="btn btn-primary" data-action="save-limit" style="margin-top:12px">儲存每日上限</button></div><div class="setting"><h3>暫停 24 小時</h3><p>${left?'目前已暫停模擬下注，直到 '+esc(left)+'。暫停期間仍可回顧紀錄與備份。':'當你發現自己想追回損失或衝動增加時，可立即啟用。期間不能新增模擬投注。'}</p><button class="btn ${left?'':'btn-danger'}" data-action="pause" ${left?'disabled':''}>${left?'暫停期間進行中':'立即暫停 24 小時'}</button></div><div class="setting"><h3>回顧你的風險</h3><p>用數字記住風險，而不是只回憶猜中的那幾次。</p><div class="stake-row"><span>累積虛擬投入</span><strong>${money(state.tickets.reduce((a,t)=>a+t.stake,0))}</strong></div><div class="stake-row"><span>已結算損益</span><strong class="${realized()<0?'negative':'positive'}">${money(realized())}</strong></div><div class="stake-row"><span>未結算曝險</span><strong>${money(exposure())}</strong></div></div><div class="setting"><h3>需要更多支持？</h3><p>如果現實中的投注已讓你感到失控，模擬工具不能取代專業協助。</p><div class="help-list"><div>張老師專線 <strong>1980</strong><p>情緒與生活困擾支持</p></div><div>生命線 <strong>1995</strong><p>需要有人傾聽時可尋求協助</p></div></div><p style="margin-top:12px">參考：<a target="_blank" rel="noopener noreferrer" href="https://blob.sportslottery.com.tw/static/en/responsiblegaming/98.html">台灣運彩責任博彩說明 ↗</a></p></div></div>`}
function dataHtml(){return `<div class="section-head"><div><h2>資料管理與賽事來源</h2><p>所有資料預設保存在此瀏覽器，沒有雲端帳號，也不會傳至我們的伺服器。</p></div></div><div class="rule-grid"><div class="setting"><h3>本機資料備份</h3><p>建議定期下載 JSON 備份，尤其是在更換手機、清除 Safari 網站資料之前。</p><div class="flex"><button class="btn btn-primary" data-action="export">↓ 匯出完整備份</button><button class="btn" data-action="import-backup">↑ 還原備份</button></div><p class="helper" style="margin-top:12px">備份包含資金、設定、賽事、歷史投注與流水。還原時會覆蓋目前全部資料。</p></div><div class="setting"><h3>新增、整理賽事</h3><p>可以自行輸入查到的隊伍、開賽時間與賠率，或匯入外部 JSON 賽事表。</p><div class="flex"><button class="btn btn-primary" data-action="custom-open">＋ 手動新增</button><button class="btn" data-action="import-feed">↑ 匯入賽事 JSON</button></div><p class="helper" style="margin-top:12px">賽事結束後請自行登錄結果；目前不會自動判定真實賽果。</p></div><div class="setting"><h3>賽事同步網址（選用）</h3><p>有合法授權的 HTTPS JSON 資料源時可填入。直接讀取需要資料源允許跨網域 CORS，不能在前端放 API 金鑰。</p><label class="field">公開 JSON 網址<input id="feedUrl" type="url" placeholder="https://example.com/matches.json" value="${esc(state.settings.feedUrl||'')}"></label><div class="flex" style="margin-top:12px"><button class="btn btn-primary" data-action="sync-feed">同步賽事</button><button class="btn" data-action="sample-feed">↓ 下載匯入格式範例</button></div><p class="helper" style="margin-top:12px">無官方即時運彩賠率串接；同步資料會標記為「外部匯入」，必須自行核對。</p></div><div class="setting"><h3>永久重建模擬帳戶</h3><p>這會清空資金、賽事及所有投注紀錄。為避免反覆重新補點，需輸入確認文字。</p><button class="btn btn-danger" data-action="reset-open">刪除紀錄並重新開始</button></div></div><div class="panel panel-padding" style="margin-top:17px"><h3>JSON 賽事匯入欄位</h3><p class="muted" style="font-size:12px;margin:7px 0">每個賽事需提供：id、sport、league、away、home、startsAt 與 odds.home / odds.away（足球可加入 odds.draw）。只同步未結算賽事；已下注票券保留成交當時的賠率。</p><code style="display:block;white-space:pre-wrap;font-size:11px;background:#f5f8fa;padding:14px;border-radius:10px;overflow:auto">{"games":[{"id":"event-001","sport":"籃球","league":"自行授權之資料","away":"客隊","home":"主隊","startsAt":"2026-11-01T12:00:00+08:00","odds":{"away":1.90,"home":1.85}}]}</code></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view&&el.closest('.nav')));document.getElementById('breadcrumb').textContent='首頁 / '+navNames[view];const app=document.getElementById('app');if(!state){app.innerHTML='<div class="banner">正在建立你的虛擬帳戶…</div>';renderSetup();return}app.innerHTML=({lobby:lobbyHtml,tickets:ticketsHtml,ledger:ledgerHtml,limits:limitsHtml,data:dataHtml}[view]||lobbyHtml)();document.getElementById('mobileSlip').classList.toggle('hidden',view!=='lobby'||ui.slip.length===0);document.getElementById('slipCounter').textContent=ui.slip.length}
function modal(title,body,actions=''){document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h3>${title}</h3><button class="close" aria-label="關閉" data-action="close-modal">×</button></div><div class="modalbody">${body}</div>${actions?`<div class="modalfoot">${actions}</div>`:''}</section></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function renderSetup(){modal('建立你的模擬帳戶',`<p class="muted">這裡不需要身分證、信用卡或真實金錢。請設定一筆一次性的虛擬初始資金，接下來每筆決定都會留下紀錄。</p><form id="setupForm"><div class="formgrid"><label class="field wide">初始虛擬資金（點）<input name="initial" type="number" min="100" max="1000000" value="10000" step="100" required></label></div><div class="banner">預設每天最多模擬投入 500 點；你可以在戒賭設定中調整。所有示範賽事都不是台灣運彩的真實賽程。</div><button class="btn btn-primary bigbutton" type="submit">開始模擬，保留真實金錢</button></form>`)}
function customModal(){modal('自行建立模擬賽事',`<p class="helper">輸入你已查證的賽事與賠率。資料由你手動提供，系統不會宣稱是官方即時賠率。</p><form id="customForm"><div class="formgrid"><label class="field">運動項目<select name="sport"><option>籃球</option><option>棒球</option><option>足球</option><option>網球</option><option>排球</option><option>其他</option></select></label><label class="field">聯賽名稱<input name="league" maxlength="60" value="自訂賽事" required></label><label class="field">客隊 / 選手 A<input name="away" maxlength="50" required></label><label class="field">主隊 / 選手 B<input name="home" maxlength="50" required></label><label class="field wide">預計開賽時間（台灣時間）<input name="startsAt" type="datetime-local" value="${new Date(Date.now()+3*3600000+8*3600000).toISOString().slice(0,16)}" required></label><label class="field">客隊賠率<input name="awayOdds" type="number" min="1.01" max="99" step=".01" placeholder="1.90" required></label><label class="field">主隊賠率<input name="homeOdds" type="number" min="1.01" max="99" step=".01" placeholder="1.85" required></label><label class="field wide">和局賠率（僅三選項賽事，非必填）<input name="drawOdds" type="number" min="1.01" max="99" step=".01" placeholder="留空表示兩選項賽事"></label></div><button type="submit" class="btn btn-primary bigbutton">新增賽事</button></form>`)}
function settleModal(id){const e=eventById(id);if(!e||e.result)return;modal('登錄賽事結果',`<div class="banner warn"><strong>手動結算提醒</strong><br>本功能不會自動核對台灣運彩官方結果。此選擇將立即結算相關模擬投注，送出後不能再修改。</div><p><strong>${esc(e.away)} VS ${esc(e.home)}</strong><br><small>${esc(e.league)} · ${esc(stamp(e.startsAt))}</small></p><form id="settleForm" data-id="${esc(id)}"><div style="display:grid;gap:11px;margin:18px 0">${pickLabels(e).map(o=>`<label><input name="result" type="radio" value="${o.key}" required> ${esc(o.label)} 獲勝</label>`).join('')}<label><input name="result" type="radio" value="void" required> 賽事作廢 / 全部退款</label></div><button type="submit" class="btn btn-primary bigbutton">確認手動結算</button></form>`)}
function placeTicket(){if(!ui.slip.length)return toast('請先選擇賽事');if(isPaused())return toast('你已啟用暫停功能，目前不可模擬下注。');if(ui.slipType==='single'&&ui.slip.length!==1||ui.slipType==='parlay'&&ui.slip.length<2)return toast('請確認單場或串關選項數量');let stake=Number(ui.stake);if(!Number.isInteger(stake)||stake<=0)return toast('模擬投入需要是大於零的整數');if(stake>state.balance)return toast('目前虛擬餘額不足，不能追加點數');if(stake>metrics().available)return toast('這筆金額超過今天設定的模擬上限');const legs=[];for(const p of ui.slip){const e=eventById(p.id);if(!canBet(e))return toast('有賽事已經開賽或已結束，請重新選擇');const option=pickLabels(e).find(x=>x.key===p.outcome);if(!option)return toast('找不到選擇的賽事選項');legs.push({eventId:e.id,away:e.away,home:e.home,pick:p.outcome,pickLabel:option.label,odds:Number(e.odds[p.outcome])})}const odds=round(legs.reduce((a,l)=>a*l.odds,1));modal('確認虛擬決定',`<div class="banner">這不會產生真實投注或金錢交易。輸入的點數將扣除並列入歷史紀錄。</div><div class="stake-row"><span>模擬投入</span><strong>${money(stake)}</strong></div><div class="stake-row"><span>選項數</span><strong>${legs.length}</strong></div><div class="stake-row"><span>鎖定賠率</span><strong>${odds.toFixed(2)}</strong></div><div class="stake-row"><span>若全部猜中，最多回收</span><strong>${money(round(stake*odds))}</strong></div><div class="stake-row"><span>可能損失</span><strong class="negative">${money(stake)}</strong></div><p class="helper" style="margin:16px 0">如果現在有想追回之前損失的心情，建議先離開畫面一段時間。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-place">確認模擬下注</button>`)}
function confirmPlace(){const stake=Number(ui.stake);if(!Number.isInteger(stake)||stake<=0||stake>state.balance||stake>metrics().available||isPaused())return closeModal();const legs=ui.slip.map(p=>{const e=eventById(p.id);if(!canBet(e))return null;const op=pickLabels(e).find(o=>o.key===p.outcome);return op?{eventId:e.id,away:e.away,home:e.home,pick:p.outcome,pickLabel:op.label,odds:Number(e.odds[p.outcome])}:null});if(legs.some(x=>!x)||!legs.length)return closeModal();const now=new Date().toISOString();const ticket={id:uid(),placedAt:now,type:ui.slipType,stake,odds:round(legs.reduce((a,l)=>a*l.odds,1)),legs,status:'pending',payout:0};state.tickets.push(ticket);state.balance=round(state.balance-stake);state.ledger.push({id:uid(),at:now,type:'stake',amount:-stake,note:`${ticket.type==='single'?'單場':'串關'}模擬投入 · ${ticket.id.slice(0,8)}`});save();ui.slip=[];closeModal();render();toast('已記錄模擬投入，沒有發生真實金流。')}
function settleEvent(id,result){const e=eventById(id);if(!e||e.result||!['away','home','draw','void'].includes(result)||result==='draw'&&!('draw' in e.odds))return;const now=new Date().toISOString();e.result=result;e.settledAt=now;for(const t of state.tickets.filter(t=>t.status==='pending')){if(!t.legs.some(l=>l.eventId===id))continue;let lost=false,pending=false,multiple=1,wins=0;for(const l of t.legs){const r=eventById(l.eventId)?.result;if(!r){pending=true;continue}if(r==='void')continue;if(r!==l.pick){lost=true;break}wins++;multiple*=l.odds}if(lost){t.status='loss';t.payout=0;t.settledAt=now}else if(!pending){t.status=wins?'win':'void';t.payout=round(t.stake*(wins?multiple:1));t.settledAt=now;if(t.payout>0){state.balance=round(state.balance+t.payout);state.ledger.push({id:uid(),at:now,type:'settle',amount:t.payout,note:`${t.status==='win'?'模擬回收':'模擬退款'} · ${t.id.slice(0,8)}`})}}}save();closeModal();render();toast('賽果已手動登錄，相關投注已重新計算。')}
function normalizeGame(item,source){if(!item||typeof item!=='object')return null;const str=(x,n)=>String(x||'').trim().slice(0,n);const id=str(item.id,120),home=str(item.home,60),away=str(item.away,60);const at=new Date(item.startsAt);const odds={};for(const key of ['home','away','draw']){const v=Number(item.odds?.[key]);if(item.odds?.[key]!=null&&Number.isFinite(v)&&v>=1.01&&v<=99)odds[key]=round(v)}if(!id||!home||!away||!Number.isFinite(at.getTime())||!(odds.home&&odds.away))return null;return{id,sport:str(item.sport||'其他',30),league:str(item.league||'外部賽事',60),home,away,startsAt:at.toISOString(),odds,source}}
function importFeed(raw){const games=Array.isArray(raw)?raw:raw?.games;if(!Array.isArray(games))throw Error('格式需包含 games 陣列');if(games.length>1000)throw Error('單次最多匯入 1,000 場');let added=0,updated=0,skipped=0;for(const row of games){const e=normalizeGame(row,'external');if(!e){skipped++;continue}const old=eventById(e.id);if(old){if(old.result||old.source==='demo'||old.source==='manual'){skipped++;continue}Object.assign(old,e);updated++}else{if(state.events.length>=3000){skipped++;continue}state.events.push(e);added++}}save();render();return `新增 ${added} 場、更新 ${updated} 場、略過 ${skipped} 場`}
function sampleFeed(){const feed={games:[{id:'your-feed-match-001',sport:'籃球',league:'自有授權資料源',away:'客隊名稱',home:'主隊名稱',startsAt:inHours(36),odds:{away:1.90,home:1.85}}]};download('賽事匯入格式範例.json',JSON.stringify(feed,null,2))}
function download(name,str){const b=new Blob([str],{type:'application/json;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(b);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function readJsonFile(file,handle){if(!file)return;if(file.size>5*1024*1024){toast('JSON 檔案不可大於 5 MB');return}const reader=new FileReader();reader.onload=()=>{try{handle(JSON.parse(String(reader.result)))}catch(err){toast('匯入失敗：'+(err.message||'JSON 讀取錯誤'))}};reader.readAsText(file)}
async function syncFeed(){const val=document.getElementById('feedUrl')?.value.trim()||state.settings.feedUrl?.trim();if(!val)return toast('請先輸入資料源網址');let url;try{url=new URL(val,location.href);if(!['https:','http:'].includes(url.protocol)||url.username||url.password||url.protocol==='http:'&&url.hostname!=='localhost'&&url.hostname!=='127.0.0.1')throw Error('資料源應使用 HTTPS 公開連結')}catch(e){return toast('網址格式無效：'+e.message)}state.settings.feedUrl=val;save();toast('正在請求賽事資料…');try{const response=await fetch(url.toString(),{mode:'cors',cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('HTTP '+response.status);const txt=await response.text();if(txt.length>2000000)throw Error('回傳資料過大');const msg=importFeed(JSON.parse(txt));toast('同步完成：'+msg)}catch(err){toast('同步失敗：'+err.message+'。請確認 CORS、來源授權與 JSON 格式。')}}
function onAction(a,el){if(a==='filter'){ui.filter=el.dataset.sport;render()}else if(a==='ticket-filter'){ui.ticketFilter=el.dataset.filter;render()}else if(a==='pick'){const id=el.dataset.id,choice=el.dataset.outcome,e=eventById(id);if(!canBet(e))return;const idx=ui.slip.findIndex(p=>p.id===id);if(idx>=0&&ui.slip[idx].outcome===choice){ui.slip.splice(idx,1)}else if(ui.slipType==='single'){ui.slip=[{id,outcome:choice}]}else if(idx>=0)ui.slip[idx]={id,outcome:choice};else ui.slip.push({id,outcome:choice});render()}else if(a==='slip-type'){ui.slipType=el.dataset.type;if(ui.slipType==='single'&&ui.slip.length>1)ui.slip=ui.slip.slice(-1);render()}else if(a==='remove-pick'){ui.slip=ui.slip.filter(p=>p.id!==el.dataset.id);render()}else if(a==='place')placeTicket();else if(a==='confirm-place')confirmPlace();else if(a==='settle-open')settleModal(el.dataset.id);else if(a==='custom-open')customModal();else if(a==='close-modal')closeModal();else if(a==='go-slip')document.getElementById('slip')?.scrollIntoView({behavior:'smooth'});else if(a==='save-limit'){const v=Number(document.getElementById('dailyLimit')?.value);if(!Number.isInteger(v)||v<1||v>100000)return toast('請輸入 1 到 100,000 的整數');state.settings.dailyLimit=v;save();render();toast('每日模擬上限已更新')}else if(a==='pause'){if(isPaused())return;modal('確認暫停 24 小時',`<p>暫停後的一天內不能新增模擬投注，但仍可查看紀錄、匯出備份。</p><p class="helper" style="margin-top:12px">這項限制不提供提前解除按鈕。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-pause">開始暫停</button>`)}else if(a==='confirm-pause'){state.settings.pauseUntil=new Date(Date.now()+86400000).toISOString();save();closeModal();render();toast('已暫停模擬投注 24 小時。')}else if(a==='export')download(`留在場外-完整備份-${todayKey(new Date())}.json`,JSON.stringify(state,null,2));else if(a==='import-backup')document.getElementById('backupImport').click();else if(a==='import-feed')document.getElementById('feedImport').click();else if(a==='sample-feed')sampleFeed();else if(a==='sync-feed')syncFeed();else if(a==='reset-open')modal('確定清空所有模擬紀錄？',`<div class="banner warn">此操作會不可逆地刪除所有票券、餘額與資金流水。建議先匯出備份。</div><label class="field">若要繼續，請輸入「重新開始」<input id="resetPhrase" autocomplete="off" placeholder="重新開始"></label>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="reset-confirm">永久刪除</button>`);else if(a==='reset-confirm'){if(document.getElementById('resetPhrase')?.value!=='重新開始')return toast('確認文字不正確');try{localStorage.removeItem(KEY)}catch(e){}state=null;ui={filter:'全部',slip:[],slipType:'single',stake:'100',ticketFilter:'all',modal:null};view='lobby';closeModal();render()} }
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'});return}const a=e.target.closest('[data-action]');if(a)onAction(a.dataset.action,a)});
document.addEventListener('input',e=>{if(e.target.id==='stakeInput'){ui.stake=e.target.value;const n=Number(ui.stake),r=document.getElementById('slipReturn'),l=document.getElementById('slipLoss');if(r)r.textContent=ui.slip.length&&n>0?money(round(n*calcOdds())):'—';if(l)l.textContent=n>0?money(n):'—'}});
document.addEventListener('submit',e=>{if(!['setupForm','customForm','settleForm'].includes(e.target.id))return;e.preventDefault();const form=e.target;const fields=new FormData(form);if(form.id==='setupForm'){const val=Number(fields.get('initial'));if(!Number.isInteger(val)||val<100||val>1000000)return toast('初始資金請設定在 100～1,000,000 點之間');state=newState(val);save();closeModal();render();toast('虛擬帳戶已建立，資料只存於本瀏覽器')}else if(form.id==='customForm'){const s=new Date(fields.get('startsAt'));const odds={away:Number(fields.get('awayOdds')),home:Number(fields.get('homeOdds'))};if(fields.get('drawOdds'))odds.draw=Number(fields.get('drawOdds'));const e=normalizeGame({id:'custom-'+uid(),sport:fields.get('sport'),league:fields.get('league'),home:fields.get('home'),away:fields.get('away'),startsAt:s.toISOString(),odds},'manual');if(!e)return toast('請確認賽事資料與賠率');state.events.push(e);save();closeModal();view='lobby';render();toast('已新增手動賽事')}else if(form.id==='settleForm'){const result=fields.get('result');if(!result)return toast('請選擇結果');settleEvent(form.dataset.id,result)}});
document.getElementById('backupImport').addEventListener('change',e=>{readJsonFile(e.target.files[0],json=>{const next=validateBackup(json);if(!confirm('這會覆蓋目前全部帳戶資料，確定要還原備份？'))return;state=next;save();ui.slip=[];view='lobby';render();toast('完整備份已還原')});e.target.value=''});
document.getElementById('feedImport').addEventListener('change',e=>{readJsonFile(e.target.files[0],json=>toast('匯入結果：'+importFeed(json)));e.target.value=''});
render();if(new URLSearchParams(location.search).get('debug')==='1')window.__simDebug={getState:()=>JSON.parse(JSON.stringify(state)),normalizeGame,importFeed,settleEvent,metrics,canBet};
})();
</script>
</body></html>
