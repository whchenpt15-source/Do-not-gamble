<main class="main"><div class="topline"><span class="breadcrumb" id="breadcrumb">首頁 / 賽事賠率</span><span class="topnote"><i class="dot"></i> 個人帳戶 · 全部虛擬點數</span></div><div id="app"></div><div class="footer">「留在場外」僅作戒賭輔助與風險模擬；與 OddsPapi、台灣運彩無任何官方關係。賠率是定時取得的歷史快照，並非即時報價；資料可能有缺漏或延遲。請勿用於真實投注決策。</div></main></div>

<script>
(()=>{'use strict';
const STORE='outside-line-member-v13';
// 部署者只需修改這一行：填入公開的 Worker 網址，不得放入任何私人金鑰。
const API_BASE_URL='https://vb09612.workers.dev';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('zh-TW',{minimumFractionDigits:0,maximumFractionDigits:2});
const money=c=>num(Number(c||0)/100)+' 點';
const datetime=s=>s?new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'無資料';
const dated=s=>s?new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const labels={lobby:'賽事賠率',tickets:'模擬紀錄',ledger:'點數流水',limits:'戒賭設定',data:'資料與同步'};
const marketLabels={h2h:'勝負',spreads:'讓分',totals:'大小分'};
let creds=(()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}})();
let data=null, view='lobby', category='全部', windowDays=7, slip=[], slipType='single', stake=100, isBusy=false, message='', modal=null;
function toast(str){const el=$('#toast');el.textContent=str;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4700)}
function validateUrl(src){const url=new URL(src);if(url.protocol!=='https:'&&url.hostname!=='localhost'&&url.hostname!=='127.0.0.1')throw Error('後端網址必須是 HTTPS');if(url.username||url.password||url.search||url.hash)throw Error('請貼 Cloudflare Worker 的根網址，不要包含參數');return url.origin}
async function api(path,method='GET',body=null,guest=false){
 const base=validateUrl(API_BASE_URL);
 const token=!guest?creds?.token:null;
 if(!guest&&!token)throw Error('請先建立 ID 或登入');
 const response=await fetch(base+path,{method,mode:'cors',cache:'no-store',headers:{...(token?{'authorization':'Bearer '+token}:{}),...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 let payload;try{payload=await response.json()}catch{throw Error('後端沒有回傳有效 JSON，請確認 Worker 已部署')}
 if(!response.ok)throw Error(payload.error||'後端錯誤 '+response.status);
 return payload;
}
function modalHtml(title,body,footer){return `<div class="modal-backdrop"><div class="modal"><div class="modalbody"><h2 style="margin-bottom:14px">${title}</h2>${body}<div class="flex-wrap" style="justify-content:flex-end;margin-top:18px">${footer}</div></div></div></div>`}
async function refresh(){if(!creds)return;try{data=await api('/api/state');message='';render()}catch(e){data=null;message=e.message;render()}}
async function run(action){if(isBusy)return;isBusy=true;try{await action()}catch(e){toast('操作未完成：'+e.message)}finally{isBusy=false;render()}}
function h(tag,cls,inner){return `<${tag} class="${cls}">${inner}</${tag}>`}
function account(){return data?.account||null}
function dailyUsed(){const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return (data.tickets||[]).filter(t=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t.placed_at))===today).reduce((a,t)=>a+t.stake_cents,0)}
function paused(){return account()?.pause_until && Date.parse(account().pause_until)>Date.now()}
function metrics(){const tickets=data.tickets||[];return {open:tickets.filter(x=>x.status==='pending').length,exposure:tickets.filter(x=>x.status==='pending').reduce((s,x)=>s+x.stake_cents,0),net:tickets.filter(x=>x.status!=='pending').reduce((s,x)=>s+(x.payout_cents||0)-x.stake_cents,0),available:Math.max(0,account().daily_limit_cents-dailyUsed())}}
function stats(){const m=metrics();return `<div class="stats"><div class="stat"><div class="statlabel">可用虛擬點數</div><div class="num">${money(account().balance_cents)}</div><div class="subline">初始 ${money(account().initial_cents)}</div></div><div class="stat"><div class="statlabel">尚未結算的風險</div><div class="num">${money(m.exposure)}</div><div class="subline">${m.open} 張待結算票券</div></div><div class="stat"><div class="statlabel">已結算淨損益</div><div class="num ${m.net<0?'negative':'positive'}">${m.net>0?'+':''}${money(m.net)}</div><div class="subline">不包含待結算部位</div></div><div class="stat"><div class="statlabel">今日尚可投入</div><div class="num">${money(m.available)}</div><div class="subline">每日上限 ${money(account().daily_limit_cents)}</div></div></div>`}
function sourceLine(){const quota=data.info?.quota||{};const last=data.info?.lastSynced;
const attempts=(data.papiSync||[]).filter(x=>x.kind==='odds');return `<div class="source-info">
<strong>來源：OddsPapi ／各賽事莊家賠率</strong> · 上次嘗試同步：${esc(dated(last))}（台灣時間） · 開啟網站不重新查 API。
<div class="downtext">今日 API 請求 ${quota.day_count??0} 次、當月 ${quota.month_count??0} 次（含探索與查詢）。每日 08:00 同步；部分賽事可能無賠率、未開盤或未完成結算。</div>
</div>`}
function fixtureMarket(e,m){const options=m.selections||[];return `<div class="market-title">${esc(m.label||marketLabels[m.key]||m.key)}</div><div class="market-odds">${options.map(o=>{const chosen=slip.some(x=>x.eventId===e.id && x.market===m.key && x.choice===o.key&&x.point===o.point);let short=o.key==='draw'?'和局':o.key==='over'?'大':o.key==='under'?'小':o.key==='home'?e.home:e.away;
return `<button class="odd ${chosen?'selected':''}" data-action="pick" data-id="${esc(e.id)}" data-market="${esc(m.key)}" data-choice="${esc(o.key)}" data-point="${o.point??''}" ${allowBet(e)?'':'disabled'}><span class="odd-label" title="${esc(short)}">${esc(short)}</span><b>${num(o.price)}</b>${o.point!=null?`<span class="faded">${o.point>0?'+':''}${o.point}</span>`:''}</button>`}).join('')}</div>`}
function allowBet(e){return e.status==='upcoming' && Date.parse(e.starts_at)>Date.now() && Date.now()-Date.parse(e.odds_updated_at)<36*3600000}
function fixtures(){let rows=(data.fixtures||[]).filter(e=>e.status==='upcoming'&&Date.parse(e.starts_at)>Date.now()).sort((a,b)=>Date.parse(a.starts_at)-Date.parse(b.starts_at));const sports=['全部','NBA','MLB','LOL','羽球'];const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const until=Date.parse(day+'T00:00:00+08:00')+windowDays*86400000;rows=rows.filter(e=>Date.parse(e.starts_at)<until);if(category!=='全部')rows=rows.filter(e=>e.sport===category);return `<div class="section-head"><div><h2>真實賽事快取</h2><p>賽程與真實莊家賠率由 OddsPapi 後端每日更新；本站僅作虛擬模擬。</p></div></div><div class="filters">${[1,3,7,14].map(d=>`<button class="chip ${windowDays===d?'active':''}" data-action="days" data-days="${d}">${d===1?'今日':`${d} 天`}</button>`).join('')}</div><div class="filters">${sports.map(s=>`<button class="chip ${s===category?'active':''}" data-action="filter" data-sport="${s}">${s}</button>`).join('')}</div>${rows.length?rows.slice(0,70).map(e=>`<article class="fixture"><div class="meta"><span>${esc(e.sport)}</span><span>· ${esc(e.league)}</span><span>· ${esc(dated(e.starts_at))}</span><span class="tag external">${esc(e.provider_bookmaker||'OddsPapi')} 快取</span></div><div class="fixture-title"><span>${esc(e.away)}</span><span class="versus">VS</span><span>${esc(e.home)}</span></div><div class="fixture-markets">${e.markets.map(m=>fixtureMarket(e,m)).join('')}</div><div class="fixture-foot"><span>賠率擷取 ${esc(datetime(e.odds_updated_at))} · ${allowBet(e)?'開賽前可模擬':'暫停模擬投注'}</span></div></article>`).join(''):'<div class="empty"><span class="big">◷</span>目前沒有可顯示的 OddsPapi 快取賽事。<div>首次部署後可到「資料與同步」執行一次同步；若賽季休賽或無報價也可能為空。</div></div>'}`}
function lookupPick(p){const e=data.fixtures.find(x=>x.id===p.eventId);const m=e?.markets.find(x=>x.key===p.market);const s=m?.selections.find(x=>x.key===p.choice&&x.point===p.point);return {e,m,s}}
function slipBox(){const combined=slip.reduce((x,p)=>x*Number(p.expectedPrice),1);const valid=slipType==='single'?slip.length===1:slip.length>=2;return `<aside class="panel slip" id="slip"><div class="panel-head"><strong>模擬投注單</strong><small>${slip.length} 個選項</small></div><div class="slip-tabs"><button class="${slipType==='single'?'active':''}" data-action="type" data-type="single">單場</button><button class="${slipType==='parlay'?'active':''}" data-action="type" data-type="parlay">串關</button></div><div class="panel-padding" style="padding-top:0">${slip.length?slip.map(p=>{const {e,s,m}=lookupPick(p);return `<div class="pick"><small>${esc(e?.league)} · ${esc(e?.away)} vs ${esc(e?.home)}</small><div class="pick-main"><strong>${esc(m?.label)}：${esc(s?.name||p.choice)} ${p.point==null?'':`(${p.point})`}</strong><span>${num(p.expectedPrice)} <button class="remove" data-action="remove" data-id="${esc(p.eventId)}">×</button></span></div></div>`}).join(''):'<div class="empty">點擊賽事賠率，加入模擬單。</div>'}<label class="formfield">虛擬投入（點）<input type="number" id="stake" value="${esc(stake)}" min="1" step="1" inputmode="numeric"></label><div class="stake-row"><span>合計賠率（四捨五入）</span><strong>${slip.length?num(combined):'—'}</strong></div><div class="stake-row"><span>若全部猜中，約可回收</span><strong>${slip.length?money(Math.round(stake*100*combined)):'—'}</strong></div><div class="slip-note">模擬賠率不是即時盤口。下注成功後會保存當時賠率，並由後端自動結算。</div><button class="btn btn-primary bigbutton" data-action="confirm-open" ${!valid||paused()||isBusy?'disabled':''}>${paused()?'正在暫停模擬':'確認虛擬投入'}</button></div></aside>`}
function lobby(){return `<section class="hero"><div><span class="eyebrow">SIMULATE, DON'T STAKE</span><h1>用真實賽事，<br>把投注留在模擬裡。</h1><p>每日快取真實賽事與報價、賽後自動計算虛擬損益。沒有真實金錢往來。</p></div><button class="hero-action" data-view="limits">設定使用界線 ↗</button></section>${stats()}${sourceLine()}<div class="pagegrid"><div>${fixtures()}</div>${slipBox()}</div>`}
function tickets(){const statuses={pending:'待結果',win:'已猜中',loss:'未猜中',void:'退款'};return `<div class="section-head"><div><h2>模擬下注紀錄</h2><p>票券與賠率快照寫在雲端 D1，重新開啟網站也不會消失。</p></div><button class="btn" data-action="export">↓ 匯出備份</button></div>${(data.tickets||[]).length?(data.tickets||[]).map(t=>`<div class="ticket-card"><div class="ticket-line"><strong>${t.type==='parlay'?'串關':'單場'} · ${t.legs.length} 場</strong><span class="status ${t.status}">${statuses[t.status]||t.status}</span></div><div class="muted-small">${esc(dated(t.placed_at))} · ${esc(t.id.slice(0,8))}</div><div class="ticket-legs" style="margin-top:9px">${t.legs.map(l=>{const e=data.fixtures.find(x=>x.id===l.fixture_id);return `<div class="ticket-line"><span>${esc(e?e.away+' vs '+e.home:l.fixture_id)} · ${esc(l.selection_label)}</span><b>${num(l.odds)}</b></div>`}).join('')}</div><div class="ticket-bottom"><span>投入 ${money(t.stake_cents)} · 合計賠率 ${num(t.combined_odds)}</span><strong>${t.status==='pending'?'等待結果':'回收 '+money(t.payout_cents)}</strong></div></div>`).join(''):'<div class="empty">目前沒有模擬下注紀錄。</div>'}`}
function ledger(){return `<div class="section-head"><div><h2>虛擬資金流水</h2><p>所有變動由後端記錄，不在瀏覽器端直接修改餘額。</p></div><button class="btn" data-action="export">↓ 匯出備份</button></div>${stats()}<section class="panel tablewrap"><table><thead><tr><th>時間</th><th>類別</th><th>內容</th><th>虛擬點數</th></tr></thead><tbody>${(data.ledger||[]).map(x=>`<tr><td>${esc(dated(x.at))}</td><td>${esc(({initial:'初始',stake:'投入',settle:'結算'})[x.type]||x.type)}</td><td>${esc(x.note)}</td><td class="${x.amount_cents>=0?'positive':'negative'}">${x.amount_cents>0?'+':''}${money(x.amount_cents)}</td></tr>`).join('')}</tbody></table></section>`}
function limits(){const m=metrics();return `<div class="section-head"><div><h2>戒賭與使用界線</h2><p>所有投注都是虛擬。透過固定的限額與停用時間降低衝動操作。</p></div></div><div class="safe-info">本網站不提供現金、儲值、提款或導向下注商家的按鈕。請不要把模擬成果視為真實投注建議。</div><div class="rule-grid"><div class="setting"><h3>每日虛擬投入上限</h3><p>今日已投入 ${money(dailyUsed())}，剩餘 ${money(m.available)}。</p><form id="limit-form"><label class="formfield">每天最多（點）<input name="dailyLimit" type="number" min="1" max="100000" value="${account().daily_limit_cents/100}" required></label><button class="btn btn-primary" type="submit">更新限制</button></form></div><div class="setting"><h3>暫停模擬 24 小時</h3><p>${paused()?'正在暫停至 '+esc(dated(account().pause_until)):'有衝動想追回損失時，建議直接暫停。'}</p><button class="btn btn-danger" data-action="pause-open" ${paused()?'disabled':''}>${paused()?'暫停中':'啟動 24 小時暫停'}</button></div></div>`}
function dataPage(){const quota=data.info?.quota||{};const syncs=data.papiSync||[];
 const report=(()=>{try{return JSON.parse(data.info?.lastReport||'{}')}catch{return {}}})();
 const coverage=(()=>{try{return JSON.parse(data.info?.coverage||'{}')}catch{return {}}})();
 return `<div class="section-head"><div><h2>我的雲端帳戶</h2><p>此手機會自動進入你的 ID；賽事快取由所有玩家共用。</p></div></div>
 <div class="rule-grid"><div class="setting"><h3>帳戶 ID：${esc(data.memberId||account()?.display_id)}</h3><p>你自己的餘額、投注紀錄和每日限額都和朋友分開。</p><div class="safe-info">復原碼只在建立帳戶時顯示一次。目前測試模式可直接使用 ID 登入；正式營運時應恢復復原碼驗證。</div>
 <div class="flex-wrap"><button class="btn" data-action="export">↓ 匯出個人備份</button><button class="btn btn-danger" data-action="logout">登出此裝置</button></div></div>
 <div class="setting"><h3>賽事來源與同步</h3><p>NBA、MLB、LOL、羽球由 OddsPapi 提供可用賽事與盤口；開啟網站只讀取 D1。</p><p>賠率與結算由 Cloudflare Worker 每日 08:00（台灣時間）自動同步。一般玩家不能手動執行管理同步。</p></div></div>
 <div class="panel panel-padding" style="margin-top:16px"><h3>共用賽事 API 用量</h3><p>今日 ${esc(quota.day_count??0)} 次 · 本月 ${esc(quota.month_count??0)} 次。四種運動所有玩家共用同一份快取。</p>
 <p style="margin-top:8px">偵測到的聯賽數：NBA ${esc((coverage.nba||[]).length)}、MLB ${esc((coverage.mlb||[]).length)}、LOL ${esc((coverage.lol||[]).length)}、羽球 ${esc((coverage.badminton||[]).length)}。</p>
 <p style="margin-top:8px">上次排程：${esc(dated(data.info?.lastSynced))}。${esc((report.results||[]).map(x=>x.error?x.kind+'：'+x.error:'').filter(Boolean).join('；'))}</p></div>`;
}
function intro(){const err=message?`<div class="safe-info" role="alert">${esc(message)}。請確認網站管理者已部署後端且正確設定 API_BASE_URL。</div>`:'';
 const invalid=API_BASE_URL.includes('YOUR_WORKER_SUBDOMAIN');
 return `<div class="connection"><section class="hero"><div><span class="eyebrow">WELCOME</span><h1>第一次進來，建立你的 ID</h1><p>每支手機只需輸入一次，之後會自動進入自己的虛擬帳戶。賽事大家共用，餘額和紀錄完全分開。</p></div></section>
 <div class="config-card"><h2>建立個人帳戶</h2><p>預設初始虛擬資金 10,000 點，每日投入上限 500 點。</p>${err}
 ${invalid?'<div class="safe-info">網站管理者尚未設定 Worker 網址，請先完成 README 的部署步驟。</div>':''}
 <form id="register-form"><label class="formfield">設定你的 ID（3～24 位英數字）<input name="id" required minlength="3" maxlength="24" placeholder="例如 player001" autocomplete="username"></label><button class="btn-main" type="submit" ${invalid?'disabled':''}>建立我的模擬帳戶</button></form>
 <div class="safe-info">測試模式：僅需 ID 即可登入既有帳戶，知道 ID 的任何人都能存取該帳戶。請勿長期公開使用。</div>
 <form id="id-login-form"><label class="formfield">已經有 ID？輸入 ID 登入<input name="id" required minlength="3" maxlength="24" autocomplete="username" placeholder="原有帳戶 ID"></label><button type="submit" class="btn-main" ${invalid?'disabled':''}>使用 ID 登入</button></form>
 <!-- 暫時隱藏原本的 ID＋復原碼表單，後端 /api/auth/recover 仍保留。 --><!--
 <details style="margin-top:22px"><summary style="cursor:pointer;font-weight:650">已經有 ID？換手機／重新登入</summary><form id="recover-form"><label class="formfield">原本的 ID<input name="id" required minlength="3" maxlength="24" autocomplete="username"></label><label class="formfield">建立帳戶時保存的復原碼<input name="recoveryCode" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="64 位英數復原碼"></label><button type="submit" class="btn-main" ${invalid?'disabled':''}>找回原帳戶</button></form></details>
 -->
 <div class="downtext">測試期間可以使用 ID 登入；恢復正常驗證後，仍需復原碼。新帳戶建立時請繼續保存復原碼。</div></div></div>`}
function render(){const nav=$('#breadcrumb'),app=$('#app');nav.textContent='首頁 / '+labels[view];document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));$('#mobileSlip').classList.toggle('hidden',view!=='lobby'||!slip.length||!data?.account);$('#slipCount').textContent=slip.length;
 if(!creds){app.innerHTML=intro();return}if(!data){app.innerHTML=message?intro():`<div class="loader">正在讀取雲端資料…</div>`;return}if(!account()){app.innerHTML=intro();return}
 app.innerHTML=({lobby,tickets,ledger,limits,data:dataPage}[view]||lobby)();$('#modalRoot').innerHTML=modal||'';
}
async function register(form){
 const id=String(new FormData(form).get('id')||'').trim();
 const result=await api('/api/auth/register','POST',{id},true);
 creds={memberId:result.memberId,token:result.token};
 localStorage.setItem(STORE,JSON.stringify(creds));
 await refresh();message='';
 const code=result.recoveryCode;
 modal=modalHtml('保存你的帳戶復原碼',`<p>你的 ID：<b>${esc(result.memberId)}</b></p>
 <div class="safe-info">請立即複製下面的復原碼，保存在密碼管理器或安全位置。<b>這組碼只會出現一次</b>，換手機或刪除瀏覽器資料後需要它。</div>
 <textarea id="recovery-output" rows="3" readonly style="width:100%;resize:none;overflow-wrap:anywhere">${esc(code)}</textarea>`,
 `<button class="btn" data-action="copy-recovery">複製復原碼</button><button class="btn btn-primary" data-action="close-modal">我已保存</button>`);
 render();
}
async function loginById(form){
 const fd=new FormData(form);
 const result=await api('/api/auth/id-login','POST',{id:String(fd.get('id')||'')},true);
 creds={memberId:result.memberId,token:result.token};
 localStorage.setItem(STORE,JSON.stringify(creds));
 await refresh();message='';toast('已登入帳戶 '+result.memberId);
}
// ID＋復原碼的原有登入邏輯保留，並未刪除。
async function recover(form){
 const fd=new FormData(form);
 const result=await api('/api/auth/recover','POST',{id:String(fd.get('id')||''),recoveryCode:String(fd.get('recoveryCode')||'')},true);
 creds={memberId:result.memberId,token:result.token};localStorage.setItem(STORE,JSON.stringify(creds));
 await refresh();message='';toast('已找回帳戶 '+result.memberId);

async function submitBet(){const s=Number($('#stake')?.value||stake);if(!Number.isInteger(s)||s<=0)return toast('請輸入整數點數');stake=s;if(stake*100>account().balance_cents)return toast('虛擬餘額不足');if(stake*100>metrics().available)return toast('已超過每日虛擬投入限額');
 const odds=slip.reduce((x,p)=>x*p.expectedPrice,1);modal=modalHtml('確認虛擬投注',`<p>本次投入：<b>${money(stake*100)}</b></p><p>共 ${slip.length} 場，賠率約 ${num(odds)}，若全中預計回收 ${money(Math.round(stake*100*odds))}。</p><div class="safe-info">只有虛擬點數會被扣除，不涉及任何真實金錢。請避免追逐過去的虧損。</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-bet">確認模擬</button>`);render()}
function action(name,el){if(name==='filter'){category=el.dataset.sport;render()}else if(name==='type'){slipType=el.dataset.type;if(slipType==='single'&&slip.length>1)slip=slip.slice(-1);render()}else if(name==='pick'){
 const e=data.fixtures.find(x=>x.id===el.dataset.id),m=e?.markets.find(x=>x.key===el.dataset.market);const pt=el.dataset.point===''?null:Number(el.dataset.point);const s=m?.selections.find(x=>x.key===el.dataset.choice&&x.point===pt);if(!s||!allowBet(e))return;const p={eventId:e.id,market:m.key,choice:s.key,point:s.point,expectedPrice:s.price};const old=slip.find(x=>x.eventId===e.id);if(old?.market===p.market&&old?.choice===p.choice&&old.point===p.point)slip=slip.filter(x=>x.eventId!==e.id);else if(slipType==='single')slip=[p];else slip=[...slip.filter(x=>x.eventId!==e.id),p];render();
 }else if(name==='remove'){slip=slip.filter(x=>x.eventId!==el.dataset.id);render()}else if(name==='go-slip')$('#slip')?.scrollIntoView({behavior:'smooth'})
 else if(name==='confirm-open')submitBet();else if(name==='close-modal'){modal=null;render()}
 else if(name==='confirm-bet')run(async()=>{await api('/api/bets','POST',{stake,picks:slip});modal=null;slip=[];await refresh();toast('已記錄虛擬下注，無真實金流')});
 else if(name==='pause-open'){modal=modalHtml('暫停 24 小時',`<p>啟動後 24 小時內無法模擬下注，也不提供提前解除功能。</p>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn btn-danger" data-action="pause-commit">啟動暫停</button>`);render()}
 else if(name==='pause-commit')run(async()=>{await api('/api/settings','POST',{kind:'pause'});modal=null;await refresh();toast('已暫停模擬 24 小時')});
 else if(name==='days'){windowDays=Number(el.dataset.days)||7;render()}
 else if(name==='copy-recovery'){const code=$('#recovery-output')?.value||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).then(()=>toast('復原碼已複製')).catch(()=>toast('請長按並複製復原碼'));else toast('請長按文字選取並複製復原碼')}
 else if(name==='export'){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='留在場外-雲端資料備份.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 else if(name==='logout'){if(confirm('登出此裝置？測試模式可用 ID 重新登入；請仍保存原有復原碼。')){localStorage.removeItem(STORE);creds=null;data=null;slip=[];render()}}
}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;render();scrollTo({top:0,behavior:'smooth'});return}const node=e.target.closest('[data-action]');if(node)action(node.dataset.action,node)});
document.addEventListener('input',e=>{if(e.target.id==='stake')stake=Number(e.target.value)});
document.addEventListener('submit',e=>{if(!['register-form','id-login-form','recover-form','limit-form'].includes(e.target.getAttribute('id')))return;e.preventDefault();const form=e.target;
 if(form.getAttribute('id')==='register-form')run(()=>register(form));
 if(form.getAttribute('id')==='id-login-form')run(()=>loginById(form));
 if(form.getAttribute('id')==='recover-form')run(()=>recover(form));
 if(form.getAttribute('id')==='limit-form')run(async()=>{const f=new FormData(form);await api('/api/settings','POST',{kind:'limit',dailyLimit:Number(f.get('dailyLimit'))});await refresh();toast('每日上限已更新')});
});
render();refresh();
if(new URLSearchParams(location.search).get('debug')==='1')window.__outsideDebug={getState:()=>data,update:refresh};
})();

</script></body></html>
